; Tacpad 9 / Model Nine by Primadon
[platformio]
default_envs = tacpad_s3

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.12.1

; Physical S3-Zero-style FH4R2 board: native USB, 4 MB flash.
[env:tacpad_s3]
board = esp32-s3-devkitm-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DTACPAD_REFERENCE_BOARD=1
    -DTACPAD_USB_HID=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; The original ESP32/Wokwi wiring is a separate, HID-free simulation target.
[env:esp32dev]
board = esp32dev
build_flags = -DTACPAD_USB_HID=0
