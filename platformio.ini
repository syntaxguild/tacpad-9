; Primadon TacPad-9
[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    ; Official registry name of Adafruit's ST7789 driver:
    adafruit/Adafruit ST7735 and ST7789 Library

; Wokwi uses an ILI9341, with the UI confined to 240x240 pixels.
[env:esp32dev]
build_flags = -DTACPAD_ILI9341
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ILI9341

; For a physical ST7789 240x240 display, use: pio run -e st7789
[env:st7789]
